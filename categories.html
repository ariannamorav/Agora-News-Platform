<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÁGORA | Categorías</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="site-header">

        <div class="container header-content">

            <a
                href="index.html"
                class="logo"
            >
                ÁGORA
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a href="news.html">
                    Noticias
                </a>

                <a
                    href="categories.html"
                    class="active"
                >
                    Categorías
                </a>

                <a href="favorites.html">
                    Favoritos
                </a>

                <a href="contact.html">
                    Contacto
                </a>

            </nav>

        </div>

    </header>



    <!-- ==========================================
         CONTENIDO
    =========================================== -->

    <main class="container news-page">

        <section class="page-header">

            <span class="section-label">
                EXPLORA ÁGORA
            </span>

            <h1>
                Categorías
            </h1>

            <p>
                Explora las noticias según el tema
                que más te interese.
            </p>

        </section>



        <!-- ======================================
             BOTONES DE CATEGORÍAS
        ======================================= -->

        <section class="categories-filter">

            <button
                type="button"
                class="category-btn active"
                data-category="Todas"
            >
                Todas
            </button>


            <button
                type="button"
                class="category-btn"
                data-category="Medio Ambiente"
            >
                Medio Ambiente
            </button>


            <button
                type="button"
                class="category-btn"
                data-category="Tecnología"
            >
                Tecnología
            </button>


            <button
                type="button"
                class="category-btn"
                data-category="Sociedad"
            >
                Sociedad
            </button>


            <button
                type="button"
                class="category-btn"
                data-category="Actualidad"
            >
                Actualidad
            </button>

        </section>



        <!-- ======================================
             NOTICIAS
        ======================================= -->

        <section>

            <div
                id="categories-container"
                class="news-grid"
            >

                <p>
                    Cargando noticias...
                </p>

            </div>

        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 ÁGORA. Todos los derechos reservados.
            </p>

        </div>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/categories.js"></script>

</body>

</html>
