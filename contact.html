<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ÁGORA | Contacto</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="site-header">

        <div class="container header-content">

            <a
                href="index.html"
                class="logo"
            >
                ÁGORA
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Inicio
                </a>

                <a href="news.html">
                    Noticias
                </a>

                <a href="categories.html">
                    Categorías
                </a>

                <a href="favorites.html">
                    Favoritos
                </a>

                <a
                    href="contact.html"
                    class="active"
                >
                    Contacto
                </a>

            </nav>

        </div>

    </header>



    <!-- ==========================================
         CONTENIDO
    =========================================== -->

    <main class="container contact-page">

        <section class="page-header">

            <span class="section-label">
                HABLEMOS
            </span>

            <h1>
                Contacto
            </h1>

            <p>
                ¿Tienes una pregunta, sugerencia o comentario?
                Escríbenos.
            </p>

        </section>



        <!-- ======================================
             FORMULARIO
        ======================================= -->

        <section class="contact-section">

            <form
                id="contact-form"
                class="contact-form"
                novalidate
            >

                <!-- Nombre -->

                <div class="form-group">

                    <label for="name">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ingresa tu nombre"
                    >

                    <small
                        id="name-error"
                        class="form-error"
                    ></small>

                </div>



                <!-- Correo -->

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                    >

                    <small
                        id="email-error"
                        class="form-error"
                    ></small>

                </div>



                <!-- Asunto -->

                <div class="form-group">

                    <label for="subject">
                        Asunto
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="¿Sobre qué quieres escribirnos?"
                    >

                    <small
                        id="subject-error"
                        class="form-error"
                    ></small>

                </div>



                <!-- Mensaje -->

                <div class="form-group">

                    <label for="message">
                        Mensaje
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Escribe tu mensaje..."
                    ></textarea>

                    <small
                        id="message-error"
                        class="form-error"
                    ></small>

                </div>



                <!-- Botón -->

                <button
                    type="submit"
                    class="btn"
                >
                    Enviar mensaje
                </button>


                <!-- Mensaje de éxito -->

                <div
                    id="form-success"
                    class="form-success"
                    role="alert"
                ></div>

            </form>

        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 ÁGORA. Todos los derechos reservados.
            </p>

        </div>

    </footer>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/contact.js"></script>

</body>

</html>
